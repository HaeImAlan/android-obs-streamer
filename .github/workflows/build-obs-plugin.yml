name: Build OBS Plugin

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OBS SDK and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libobs-dev cmake build-essential

      - name: Build plugin
        run: |
          cd obs-plugin/native
          mkdir build && cd build
          cmake -DLIBOBS_INCLUDE_DIR=/usr/include/obs ..
          make -j$(nproc)

      - name: Bundle platform-tools (adb) for Linux
        run: |
          curl -sSL -o platform-tools.zip \
            https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip -q platform-tools.zip
          mkdir -p pkg/obs-android-usbcam/data/adb
          cp platform-tools/adb pkg/obs-android-usbcam/data/adb/adb
          chmod +x pkg/obs-android-usbcam/data/adb/adb

      - name: Package
        run: |
          mkdir -p pkg/obs-android-usbcam/bin/x86_64
          cp obs-plugin/native/build/obs-android-usbcam.so pkg/obs-android-usbcam/bin/x86_64/
          cd pkg && tar czf ../obs-android-usbcam-linux-x64.tar.gz obs-android-usbcam

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-linux-x64
          path: obs-android-usbcam-linux-x64.tar.gz

      - name: Upload to dev release
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          make_latest: false
          body: |
            Automated build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.
          files: obs-android-usbcam-linux-x64.tar.gz

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Clone obs-plugintemplate
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/obsproject/obs-plugintemplate.git tpl

      - name: Inject our plugin source into template
        shell: pwsh
        run: |
          # Wipe template's example sources and drop ours in.
          Remove-Item -Recurse -Force tpl/src/*
          Copy-Item obs-plugin/native/src/plugin.c     tpl/src/plugin-main.c
          Copy-Item obs-plugin/native/src/stb_image.h  tpl/src/stb_image.h

          # Rename plugin in buildspec.json so artifacts/installers come out
          # named after our project rather than "obs-plugintemplate".
          $bs = Get-Content tpl/buildspec.json -Raw
          $bs = $bs -replace '"name":\s*"[^"]*"', '"name": "obs-android-usbcam"'
          $bs = $bs -replace '"author":\s*"[^"]*"', '"author": "haeimalan"'
          $bs = $bs -replace '"website":\s*"[^"]*"', '"website": "https://github.com/haeimalan/android-obs-streamer"'
          Set-Content tpl/buildspec.json $bs

      - name: Build plugin (Windows x64)
        shell: pwsh
        working-directory: tpl
        run: |
          # The template ships a PowerShell build script that fetches
          # prebuilt obs-deps + qt6 + libobs and configures cmake presets.
          ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package plugin
        shell: pwsh
        working-directory: tpl
        run: |
          ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo
          # Collect any zip the template produced into a stable filename.
          $zip = Get-ChildItem -Recurse -Filter '*windows-x64*.zip' | Select-Object -First 1
          if ($null -eq $zip) {
            $zip = Get-ChildItem -Recurse -Filter 'obs-android-usbcam*.zip' | Select-Object -First 1
          }
          if ($null -eq $zip) { throw "No plugin zip found after packaging" }
          Copy-Item $zip.FullName ../obs-android-usbcam-windows-x64.zip

      - name: Locate built DLL
        id: find_dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Path tpl -Filter 'obs-android-usbcam.dll' |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
                 Select-Object -First 1
          if ($null -eq $dll) { throw "Could not find built obs-android-usbcam.dll" }
          Write-Host "Found: $($dll.FullName)"
          "dll_path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Bundle platform-tools (adb) for Windows
        id: adb_dir
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" `
            -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .
          $adbDir = (Resolve-Path platform-tools).Path
          if (-not (Test-Path "$adbDir\adb.exe")) {
            throw "adb.exe missing after extraction"
          }
          Write-Host "adb dir: $adbDir"
          "adb_dir=$adbDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Inject adb into plugin zip
        shell: pwsh
        run: |
          # Unpack the template-built zip, add adb under data/, repack.
          $stage = "zip-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Expand-Archive obs-android-usbcam-windows-x64.zip -DestinationPath $stage
          $root = Get-ChildItem $stage -Directory | Select-Object -First 1
          if ($null -eq $root) { $root = Get-Item $stage }
          $dataAdb = Join-Path $root.FullName "data\adb"
          New-Item -ItemType Directory -Force -Path $dataAdb | Out-Null
          Copy-Item "${{ steps.adb_dir.outputs.adb_dir }}\adb.exe"          $dataAdb
          Copy-Item "${{ steps.adb_dir.outputs.adb_dir }}\AdbWinApi.dll"    $dataAdb
          Copy-Item "${{ steps.adb_dir.outputs.adb_dir }}\AdbWinUsbApi.dll" $dataAdb
          Remove-Item obs-android-usbcam-windows-x64.zip
          Compress-Archive -Path "$stage\*" -DestinationPath obs-android-usbcam-windows-x64.zip

      - name: Build NSIS installer
        shell: pwsh
        run: |
          # NSIS is preinstalled on windows-2022 runners under Program Files (x86)
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis `
            "/DPLUGIN_DLL=${{ steps.find_dll.outputs.dll_path }}" `
            "/DADB_DIR=${{ steps.adb_dir.outputs.adb_dir }}" `
            "/DOUTFILE=$PWD\obs-android-usbcam-installer.exe" `
            obs-plugin/native/installer/installer.nsi
          if (-not (Test-Path obs-android-usbcam-installer.exe)) {
            throw "Installer build failed"
          }

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-windows-x64
          path: obs-android-usbcam-windows-x64.zip

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-windows-installer
          path: obs-android-usbcam-installer.exe

      - name: Upload to dev release
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          make_latest: false
          body: |
            Automated build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.
          files: |
            obs-android-usbcam-windows-x64.zip
            obs-android-usbcam-installer.exe
