name: Build OBS Plugin

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OBS SDK and build deps
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio libobs-dev cmake build-essential

      - name: Build plugin
        run: |
          cd obs-plugin/native
          mkdir build && cd build
          cmake -DLIBOBS_INCLUDE_DIR=/usr/include/obs ..
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p pkg/obs-android-usbcam/bin/x86_64
          cp obs-plugin/native/build/obs-android-usbcam.so pkg/obs-android-usbcam/bin/x86_64/
          cd pkg && tar czf ../obs-android-usbcam-linux-x64.tar.gz obs-android-usbcam

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-linux-x64
          path: obs-android-usbcam-linux-x64.tar.gz

      - name: Upload to dev release
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          make_latest: false
          body: |
            Automated build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.
          files: obs-android-usbcam-linux-x64.tar.gz

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download OBS SDK
        shell: pwsh
        run: |
          $url = "https://github.com/obsproject/obs-studio/releases/download/30.1.2/OBS-Studio-30.1.2-Windows.zip"
          Invoke-WebRequest -Uri $url -OutFile obs-sdk.zip
          # We need headers from source for plugin dev
          $srcUrl = "https://github.com/obsproject/obs-studio/archive/refs/tags/30.1.2.zip"
          Invoke-WebRequest -Uri $srcUrl -OutFile obs-src.zip
          Expand-Archive obs-src.zip -DestinationPath obs-src

      - name: Download OBS prebuilt libs
        shell: pwsh
        run: |
          # Get the obs.lib from the installed OBS
          Expand-Archive obs-sdk.zip -DestinationPath obs-install

      - name: Build plugin
        shell: cmd
        run: |
          cd obs-plugin\native
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ^
            -DLIBOBS_INCLUDE_DIR=%CD%\..\..\..\obs-src\obs-studio-30.1.2\libobs ^
            -DLIBOBS_LIB=%CD%\..\..\..\obs-install\bin\64bit\obs.lib ^
            ..
          cmake --build . --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/obs-android-usbcam/bin/64bit
          Copy-Item obs-plugin/native/build/Release/obs-android-usbcam.dll pkg/obs-android-usbcam/bin/64bit/
          Compress-Archive -Path pkg/obs-android-usbcam -DestinationPath obs-android-usbcam-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-windows-x64
          path: obs-android-usbcam-windows-x64.zip

      - name: Upload to dev release
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          make_latest: false
          body: |
            Automated build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.
          files: obs-android-usbcam-windows-x64.zip
