name: Build APK

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APKs for download
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/usbcam-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/usbcam-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: usbcam-debug
          path: artifacts/usbcam-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: usbcam-release
          path: artifacts/usbcam-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/usbcam-debug.apk
            artifacts/usbcam-release.apk

      - name: Create latest dev release
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          make_latest: false
          body: |
            Automated build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.
            Download the APK below and sideload onto your device.
          files: |
            artifacts/usbcam-debug.apk
            artifacts/usbcam-release.apk
